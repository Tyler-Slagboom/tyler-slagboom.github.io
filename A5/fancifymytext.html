<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width-device-width" />

		<title>Fancify Shamcify</title>

		<link rel="stylesheet" href="style.css" />

		<!-- link to your script file here -->

		<script src="fancifymytext.js" defer></script>
		
	</head>

	<body>
		<h1>Fancify my Text</h1>

		<!-- Your UI controls go here -->
		<form>
			
			<fieldset>

				<legend>Text</legend>

				<textarea id="fancifymytext" name="fancifymytext" rows="4" cols="30"></textarea>

			</fieldset>

			<fieldset>

				<legend>Fancify</legend>

				<button type="button" id="bigger">Bigger!</button> <br>

				<input type="radio" id="fancy" name="setting" value="F" />
				<label for="fancy">FancySchmancy</label> <br>
				
				<input type="radio" id="boring" name="setting" value="B" />
				<label for="boring">BoringBetty</label> <br>

				<button type="button" id="moo">Moo!</button> <br>
			</fieldset>
		</form>
	</body>
</html>
